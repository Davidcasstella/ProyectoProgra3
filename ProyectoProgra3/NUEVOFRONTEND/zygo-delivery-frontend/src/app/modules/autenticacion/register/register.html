<!-- src/app/modules/autenticacion/register/register.html -->
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="gradient" x1="2" y1="2" x2="22" y2="22">
              <stop offset="0%" stop-color="#8a2be2"/>
              <stop offset="100%" stop-color="#00bfff"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>Crear Cuenta</h1>
      <p>Únete a Zygo Delivery</p>
    </div>

    @if (error()) {
      <div class="error-message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <path d="M12 8V12M12 16H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="onRegister()" class="login-form">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input
          type="text"
          id="nombre"
          class="form-input"
          [value]="nombre()"
          (input)="nombre.set($any($event.target).value)"
          placeholder="Tu nombre"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          class="form-input"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-input"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            placeholder="Mínimo 6 caracteres"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-input"
            [value]="confirmPassword()"
            (input)="confirmPassword.set($any($event.target).value)"
            placeholder="Repetir contraseña"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input
          type="tel"
          id="telefono"
          class="form-input"
          [value]="telefono()"
          (input)="telefono.set($any($event.target).value)"
          placeholder="3001234567"
          required
        />
      </div>

      <div class="form-group">
        <label for="direccion">Dirección</label>
        <input
          type="text"
          id="direccion"
          class="form-input"
          [value]="direccion()"
          (input)="direccion.set($any($event.target).value)"
          placeholder="Calle 123 #45-67"
          required
        />
      </div>

      <div class="form-group">
        <label for="tipo">Tipo de cuenta</label>
        <select
          id="tipo"
          class="form-input"
          [value]="tipo()"
          (change)="tipo.set($any($event.target).value)"
          required
        >
          <option value="CLIENTE">Cliente</option>
          <option value="REPARTIDOR">Repartidor</option>
        </select>
      </div>

      <button type="submit" class="login-button" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
          Creando cuenta...
        } @else {
          Registrarse
        }
      </button>
    </form>

    <div class="register-section">
      <p>¿Ya tienes cuenta?</p>
      <button type="button" class="register-button" (click)="onBack()">
        Iniciar Sesión
      </button>
    </div>

    <div class="login-footer">
      <p>© 2024 Zygo Delivery. Todos los derechos reservados.</p>
    </div>
  </div>

  <div class="background-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>
</div>
