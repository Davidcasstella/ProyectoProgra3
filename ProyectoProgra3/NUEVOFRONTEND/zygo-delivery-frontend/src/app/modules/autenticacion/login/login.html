<!-- src/app/modules/autenticacion/login/login.html -->

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="gradient" x1="2" y1="2" x2="22" y2="22">
              <stop offset="0%" stop-color="#8a2be2"/>
              <stop offset="100%" stop-color="#00bfff"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>Zygo Delivery</h1>
      <p>Sistema de Gestión de Pedidos</p>
    </div>

    @if (error()) {
      <div class="error-message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <path d="M12 8V12M12 16H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          class="form-input"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          placeholder="correo@ejemplo.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          class="form-input"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          placeholder="Ingresa tu contraseña"
          required
        />
      </div>

      <button type="submit" class="login-button" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
          Ingresando...
        } @else {
          Ingresar al Sistema
        }
      </button>
    </form>

    <div class="register-section">
      <p>¿No tienes cuenta?</p>
      <button type="button" class="register-button" (click)="onRegister()">
        Registrarse
      </button>
    </div>

    <div class="login-footer">
      <p>© 2024 Zygo Delivery. Todos los derechos reservados.</p>
    </div>
  </div>

  <div class="background-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>
</div>
