<!-- src/app/modules/gestion-usuarios/crear-usuarios/crear-usuarios.html -->

<div class="page-layout">
  <app-navbar></app-navbar>
  
  <div class="main-content">
    <!-- Header -->
    <div class="page-header">
      <div>
        <h1>Crear Nuevo Usuario</h1>
        <p>Completa los datos del nuevo usuario</p>
      </div>
    </div>

    <!-- Formulario -->
    <div class="form-container">
      <form (ngSubmit)="onSubmit()" class="form-card">
        @if (error()) {
          <div class="alert alert-error">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ error() }}
          </div>
        }

        <!-- Información Personal -->
        <div class="form-section">
          <h3 class="section-title">Información Personal</h3>
          
          <div class="form-grid">
            <div class="form-group">
              <label for="nombre">
                Nombre Completo <span class="required">*</span>
              </label>
              <input
                type="text"
                id="nombre"
                [value]="usuario().nombre"
                (input)="updateField('nombre', $any($event.target).value)"
                placeholder="Nombre completo del usuario"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">
                Correo Electrónico <span class="required">*</span>
              </label>
              <input
                type="email"
                id="email"
                [value]="usuario().email"
                (input)="updateField('email', $any($event.target).value)"
                placeholder="correo@ejemplo.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="telefono">
                Teléfono <span class="required">*</span>
              </label>
              <input
                type="tel"
                id="telefono"
                [value]="usuario().telefono"
                (input)="updateField('telefono', $any($event.target).value)"
                placeholder="3001234567"
                required
              />
            </div>

            <div class="form-group full-width">
              <label for="direccion">
                Dirección <span class="required">*</span>
              </label>
              <input
                type="text"
                id="direccion"
                [value]="usuario().direccion"
                (input)="updateField('direccion', $any($event.target).value)"
                placeholder="Dirección completa"
                required
              />
            </div>
          </div>
        </div>

        <!-- Tipo de Usuario -->
        <div class="form-section">
          <h3 class="section-title">Tipo de Usuario</h3>
          
          <div class="tipo-usuario-grid">
            <label class="radio-card" [class.selected]="usuario().tipo === TipoUsuario.CLIENTE">
              <input
                type="radio"
                name="tipo"
                [value]="TipoUsuario.CLIENTE"
                [checked]="usuario().tipo === TipoUsuario.CLIENTE"
                (change)="updateField('tipo', TipoUsuario.CLIENTE)"
              />
              <div class="radio-card-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <div class="radio-card-title">Cliente</div>
              <div class="radio-card-description">Usuario que solicita pedidos</div>
            </label>

            <label class="radio-card" [class.selected]="usuario().tipo === TipoUsuario.REPARTIDOR">
              <input
                type="radio"
                name="tipo"
                [value]="TipoUsuario.REPARTIDOR"
                [checked]="usuario().tipo === TipoUsuario.REPARTIDOR"
                (change)="updateField('tipo', TipoUsuario.REPARTIDOR)"
              />
              <div class="radio-card-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="1" y="3" width="15" height="13"></rect>
                  <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                  <circle cx="5.5" cy="18.5" r="2.5"></circle>
                  <circle cx="18.5" cy="18.5" r="2.5"></circle>
                </svg>
              </div>
              <div class="radio-card-title">Repartidor</div>
              <div class="radio-card-description">Usuario que entrega pedidos</div>
            </label>
          </div>
        </div>

        <!-- Botones -->
        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="cancelar()">
            Cancelar
          </button>
          <button type="submit" class="btn-primary" [disabled]="loading()">
            @if (loading()) {
              <span class="spinner"></span>
              Creando...
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              Crear Usuario
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
