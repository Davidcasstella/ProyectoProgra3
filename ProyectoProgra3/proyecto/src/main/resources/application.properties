spring.application.name=ZygoDelivery

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/zygo_delivery?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging Configuration
logging.level.root=INFO
logging.level.com.Zygo.proyecto=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/zygo-delivery.log

# Server Configuration
server.port=8080

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25
spring.task.execution.thread-name-prefix=zygo-async-

# JWT Configuration - CLAVE MAS LARGA (minimo 512 bits = 64 caracteres)
jwt.secret=ZygoDeliverySecretKey2024MuySeguraYLargaParaProduccion123456789AbCdEfGhIjKlMnOpQrStUvWxYz0123456789
jwt.expiration=86400000