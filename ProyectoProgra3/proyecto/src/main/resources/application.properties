# ===================================================================
# CONFIGURACIÓN SPRING BOOT - ZYGO DELIVERY
# ===================================================================

# ===================================================================
# SERVIDOR
# ===================================================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ===================================================================
# BASE DE DATOS MySQL
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/zygo_delivery?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ⭐ SOLUCIÓN 1: Desactivar Open-In-View (mejora performance)
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURACIÓN DE POOL DE CONEXIONES (HikariCP)
# ===================================================================
# ⭐ SOLUCIÓN 2: Configurar pool explícitamente
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===================================================================
# LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.com.Zygo.proyecto=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ⭐ SOLUCIÓN 3: Reducir warning de AuthenticationManager
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ===================================================================
# SEGURIDAD JWT
# ===================================================================
jwt.secret=ZygoDeliverySecretKey2024SuperSecureKeyForJWTTokenGenerationWith64Chars
jwt.expiration=86400000

# ===================================================================
# ACTUATOR (Monitoreo)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===================================================================
# ASYNC / CACHE
# ===================================================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=zygo-async-

# ===================================================================
# MULTIPART (Upload de archivos)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB